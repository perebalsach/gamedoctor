[project]
name = "gamedoctor"
version = "0.1.0"
description = "Linux Game Doctor: diagnose and explain Linux gaming configuration problems"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Pere Balsach" }]
keywords = ["linux", "gaming", "steam", "proton", "vulkan", "diagnostics"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Systems Administration",
]
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
gamedoctor = "gamedoctor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamedoctor"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
